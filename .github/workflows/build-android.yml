name: build-android

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Version from run number
        # Digits of the run number: 87 is 0.8.7, 1016 is 10.1.6 (DECISIONS.md 39).
        run: |
          N=${{ github.run_number }}
          echo "ARDOUR_VERSION=$((N / 100)).$((N / 10 % 10)).$((N % 10))" >> "$GITHUB_ENV"
      - run: test -f gradle/verification-metadata.xml
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon :app:assembleSideloadDebug -PardourVersion="$ARDOUR_VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-apks
          path: app/build/outputs/apk/sideload/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  plan:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    outputs:
      needed: ${{ steps.check.outputs.needed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: check
        # Version = digits of the run number (DECISIONS.md 39). A release is made unless its tag exists (a re-run).
        run: |
          N=${{ github.run_number }}
          V="$((N / 100)).$((N / 10 % 10)).$((N % 10))"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$V" > /dev/null; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: [build, plan]
    if: ${{ needs.plan.outputs.needed == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      # Public certificate fingerprint of the release key (DECISIONS.md 15).
      EXPECTED_CERT_SHA256: 0d11cb47bebabb3197d38fed88e6c2f3c5cc5863e3931cdb6a4e976eda591c03
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - run: test -f gradle/verification-metadata.xml
      - run: chmod +x gradlew
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ardour-release.p12"
      - name: Build signed APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/ardour-release.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: ./gradlew --no-daemon :app:assembleSideloadRelease -PardourVersion="$VERSION"
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/ardour-release.p12"
      - name: Verify signature and name files
        run: |
          set -e
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          OUT=app/build/outputs/apk/sideload/release
          mkdir dist
          cp "$OUT/app-sideload-release.apk" "dist/Ardour-$VERSION.apk"
          for f in dist/*.apk; do
            "$APKSIGNER" verify --print-certs "$f" > cert.txt
            if ! grep -qi "SHA-256 digest: $EXPECTED_CERT_SHA256" cert.txt; then
              echo "Wrong or missing signing certificate: $f"
              exit 1
            fi
          done
      - name: Release notes
        run: |
          WEBKIT=$(sed -n 's/^webkit = "\(.*\)"$/\1/p' gradle/libs.versions.toml)
          {
            echo "Engine: the phone's Android System WebView (Android 10 or newer; profile support checked at launch). Library: androidx.webkit $WEBKIT."
            echo
            echo "Signing certificate SHA-256: $EXPECTED_CERT_SHA256"
            echo
            echo "APK SHA-256:"
            echo '```'
            (cd dist && sha256sum *.apk)
            echo '```'
          } > notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" dist/*.apk --title "Ardour $VERSION" --notes-file notes.md --target "$GITHUB_SHA"
